<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Finals Vote Results · MedicineBank Initiative</title>

  <meta name="theme-color" content="#0b0b0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Merriweather:wght@300;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0b0b0b;
      --carbon-60: #58585b;
      --carbon-40: #8e8e8e;
      --carbon-20: #d9d9d9;
      --carbon-05: #f5f5f5;
      --white: #f7f5f4;
      --blue: #1a5fa8;
      --burg: #7d2040;
      --orange: #c4601a;
      --orange-dark: #a34e14;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html { background: var(--black); }

    body {
      --page-bg: var(--white);
      --surface-bg: #ffffff;
      --surface-alt-bg: var(--carbon-05);
      --text-primary: var(--black);
      --text-secondary: var(--carbon-60);
      --text-tertiary: var(--carbon-40);
      --divider: var(--carbon-20);
      --c1: #1a5fa8; --c2: #c4601a; --c3: #7d2040;
      font-family: 'Inter', sans-serif; background: var(--page-bg); color: var(--text-primary); line-height: 1.6;
      min-height: 100vh;
      padding-bottom: calc(24px + var(--safe-bottom));
      transition: background .2s ease, color .2s ease;
    }
    body.theme-dark {
      --page-bg: #0e0e0e;
      --surface-bg: #161616;
      --surface-alt-bg: #1c1c1c;
      --text-primary: var(--white);
      --text-secondary: #b9b9bb;
      --text-tertiary: #8e8e8e;
      --divider: #2b2b2b;
      --c1: #4f94d9; --c3: #c8587f;
    }
    button { font-family: inherit; }

    @keyframes pulse { 50% { opacity: .25; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* COUNTDOWN BAR */
    .countdown {
      position: sticky; top: 0; z-index: 1000;
      background: var(--orange); color: #fff;
      padding: calc(var(--safe-top) + 10px) 20px 10px;
      display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
      text-align: center; transition: background .3s;
    }
    .countdown.closed { background: var(--burg); }
    .cd-text { font-size: .74rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    .cd-time { font-size: 1.05rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
    .countdown.closed .dot { animation: none; }
    .theme-btn {
      position: absolute; right: 8px; top: calc(var(--safe-top) + 2px);
      width: 44px; height: 44px; display: grid; place-items: center;
      background: none; border: 0; color: #fff; cursor: pointer; border-radius: 50%;
    }
    .theme-btn:active { background: rgba(255,255,255,.2); }

    /* HERO */
    .hero { padding: 36px 40px 32px; border-bottom: 1px solid var(--divider); max-width: 760px; margin: 0 auto; }
    .label-tag { font-size: .68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 6px; }
    .hero-title { font-weight: 700; font-size: 1.7rem; line-height: 1.3; margin-bottom: 8px; }
    .hero-title.t1 { color: var(--c1); } .hero-title.t2 { color: var(--c2); } .hero-title.t3 { color: var(--c3); }
    .hero-dek { font-size: .95rem; color: var(--text-secondary); }

    /* SECTIONS */
    section.block { padding: 40px 40px; max-width: 760px; margin: 0 auto; }
    section.block + section.block { padding-top: 0; }
    .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .section-sub { font-size: .82rem; color: var(--text-secondary); margin-bottom: 20px; }

    /* CARD */
    .panel { background: var(--surface-bg); border: 2px solid var(--divider); border-radius: 2px; padding: 20px 18px; animation: rise .4s ease both; }

    /* DONUT */
    .dn { position: relative; width: 170px; height: 170px; margin: 4px auto 24px; }
    .dn svg { width: 170px; height: 170px; transform: rotate(-90deg); display: block; }
    .track, .seg { fill: none; stroke-width: 14; }
    .track { stroke: var(--divider); }
    .seg { transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); }
    .dc { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .dc b { font-size: 2rem; font-weight: 900; line-height: 1; }
    .dc small { font-size: .64rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-tertiary); }

    /* BARS */
    .bar { margin-bottom: 16px; }
    .bar:last-child { margin-bottom: 0; }
    .bh { display: flex; align-items: center; gap: 10px; font-size: .88rem; margin-bottom: 6px; }
    .bn { flex: 1; font-family: 'Merriweather','Inter',serif; font-weight: 700; }
    .bh small { color: var(--text-tertiary); width: 40px; text-align: right; font-size: .78rem; }
    .bh b { font-variant-numeric: tabular-nums; }
    .badge { font-size: .66rem; font-weight: 700; letter-spacing: 1.6px; color: #fff; padding: 3px 9px; border-radius: 2px; background: var(--cc); }
    .bt { height: 10px; background: var(--surface-alt-bg); border-radius: 5px; overflow: hidden; }
    .bt i { display: block; height: 100%; width: 0; background: var(--cc); border-radius: 5px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
    .bar.win .bn::after { content: " ★"; color: var(--cc); }

    /* CHART */
    .chart { width: 100%; height: auto; display: block; overflow: visible; }
    .chart text { font-family: 'Inter', sans-serif; font-size: 10px; fill: var(--text-tertiary); }
    .chart .gl { stroke: var(--divider); stroke-width: 1; }
    .chart .ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .leg { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: .76rem; color: var(--text-secondary); }
    .leg span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--cc); margin-right: 6px; }
    .peak { font-size: .82rem; color: var(--text-secondary); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--divider); }
    .empty { text-align: center; color: var(--text-tertiary); font-size: .85rem; padding: 24px 0; }

    .msg { padding: 12px 14px; font-size: .82rem; border-radius: 2px; margin: 0 auto 16px; max-width: 680px; background: rgba(196,96,26,.12); color: var(--orange-dark); border: 1px solid var(--orange); }
    body.theme-dark .msg { color: #f0a36b; }
    .upd { font-size: .72rem; color: var(--text-tertiary); text-align: center; padding: 0 20px; }

    @media (max-width: 640px) {
      .hero { padding: 28px 20px 26px; }
      .hero-title { font-size: 1.35rem; }
      section.block { padding: 32px 20px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<script>
  (function () {
    var s = localStorage.getItem('mb_theme');
    var dark = s ? s === 'theme-dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    document.body.classList.add(dark ? 'theme-dark' : 'theme-light');
  })();
</script>

<div class="countdown" id="countdown">
  <i class="dot"></i>
  <span class="cd-text" id="cdText">Voting closes in</span>
  <span class="cd-time" id="cdTime">--:--:--</span>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
  </button>
</div>

<div class="hero">
  <p class="label-tag" id="tag">Student Vote · Finals</p>
  <h1 class="hero-title" id="title">Loading results…</h1>
  <p class="hero-dek" id="dek"></p>
</div>

<section class="block">
  <h2 class="section-title">Votes by timetable</h2>
  <p class="section-sub">Total counted votes for each option.</p>
  <div class="panel">
    <div class="dn"><svg viewBox="0 0 120 120" id="dsvg"></svg><div class="dc"><b id="tot">0</b><small>votes</small></div></div>
    <div id="bars"></div>
  </div>
</section>

<section class="block">
  <h2 class="section-title">Votes over time</h2>
  <p class="section-sub">Cumulative votes for each timetable, hour by hour.</p>
  <div class="panel">
    <div id="chart"></div>
    <div class="leg" id="leg"></div>
    <p class="peak" id="peak" hidden></p>
  </div>
</section>

<div class="msg" id="err" hidden></div>
<p class="upd" id="upd"></p>

<script>
  /* ══ CONFIG ══ */
  const FN_URL = 'https://igfooetzorzhhvpakgqa.supabase.co/functions/v1/vote-results';
  const DEADLINE = new Date('2026-11-06T00:00:00+02:00').getTime();
  const REFRESH_MS = 30000;

  const TT = { 1: { n: 'Timetable 1', c: 'var(--c1)' }, 2: { n: 'Timetable 2', c: 'var(--c2)' }, 3: { n: 'Timetable 3', c: 'var(--c3)' } };
  const RAW = { 1: '#1a5fa8', 2: '#c4601a', 3: '#7d2040' };
  const $ = (id) => document.getElementById(id);
  const HR = 36e5;
  const pad = (n) => String(n).padStart(2, '0');
  const isClosed = () => Date.now() >= DEADLINE;
  const fmtH = (t) => new Date(t).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  let lastSig = '', data = null;

  /* ══ COUNTDOWN ══ */
  function tick() {
    const left = DEADLINE - Date.now(), bar = $('countdown');
    if (left <= 0) {
      bar.classList.add('closed');
      $('cdText').textContent = 'Voting has ended';
      $('cdTime').textContent = '';
      return;
    }
    bar.classList.remove('closed');
    $('cdText').textContent = 'Voting closes in';
    $('cdTime').textContent = pad(Math.floor(left / HR)) + ':' + pad(Math.floor(left % HR / 6e4)) + ':' + pad(Math.floor(left % 6e4 / 1e3));
  }

  /* ══ DATA (no key needed) ══ */
  async function fetchResults() {
    const r = await fetch(FN_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  /* ══ RENDER ══ */
  function render(d) {
    const cnt = { 1: +(d.totals[1] || 0), 2: +(d.totals[2] || 0), 3: +(d.totals[3] || 0) };
    const n = cnt[1] + cnt[2] + cnt[3], mx = Math.max(cnt[1], cnt[2], cnt[3]);
    const lead = [1, 2, 3].filter((k) => cnt[k] === mx && mx > 0);
    const closed = isClosed(), sig = JSON.stringify(cnt), anim = sig !== lastSig;
    lastSig = sig;

    $('tag').textContent = closed ? 'Final result' : 'Live result';
    const t = $('title');
    if (!n) { t.className = 'hero-title'; t.textContent = 'No votes yet'; $('dek').textContent = 'Results will appear here as votes come in.'; }
    else if (lead.length > 1) {
      t.className = 'hero-title';
      t.textContent = closed ? 'It’s a tie' : 'Currently tied';
      $('dek').textContent = lead.map((k) => TT[k].n).join(' and ') + ' are level on ' + mx + ' vote' + (mx > 1 ? 's' : '') + ' each.';
    } else {
      const k = lead[0];
      t.className = 'hero-title t' + k;
      t.textContent = TT[k].n + (closed ? ' wins' : ' leads');
      $('dek').textContent = mx + ' of ' + n + ' votes (' + Math.round(mx / n * 100) + '%)' + (closed ? '.' : ' so far.');
    }

    const C = 2 * Math.PI * 42; let acc = 0;
    $('dsvg').innerHTML = '<circle class="track" cx="60" cy="60" r="42"/>' + [1, 2, 3].map((k) => {
      const l = n ? cnt[k] / n * C : 0;
      const s = `<circle class="seg" cx="60" cy="60" r="42" stroke="${RAW[k]}" data-l="${l}" style="stroke-dasharray:${anim ? 0 : l} ${anim ? C : C - l};stroke-dashoffset:${-acc}"/>`;
      acc += l; return s;
    }).join('');
    $('tot').textContent = n;

    $('bars').innerHTML = [1, 2, 3].map((k) => {
      const p = n ? cnt[k] / n * 100 : 0;
      return `<div class="bar${lead.length === 1 && lead[0] === k ? ' win' : ''}" style="--cc:${RAW[k]}"><div class="bh"><span class="badge">${k}</span><span class="bn">${TT[k].n}</span><b>${cnt[k]}</b><small>${p.toFixed(0)}%</small></div><div class="bt"><i data-w="${p}" style="width:${anim ? 0 : p}%"></i></div></div>`;
    }).join('');
    if (anim) requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('.seg').forEach((s) => s.style.strokeDasharray = s.dataset.l + ' ' + (C - s.dataset.l));
      document.querySelectorAll('.bt i').forEach((i) => i.style.width = i.dataset.w + '%');
    }));

    renderChart(d.timeline || []);
    $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · refreshes automatically';
  }

  function renderChart(tl) {
    const box = $('chart'), leg = $('leg'), pk = $('peak');
    const per = { 1: {}, 2: {}, 3: {} }, hourTot = {}; let t0 = Infinity, t1 = -Infinity;
    tl.forEach((x) => {
      if (!(x.c in per)) return;
      const t = new Date(x.h).getTime();
      per[x.c][t] = (per[x.c][t] || 0) + x.n;
      hourTot[t] = (hourTot[t] || 0) + x.n;
      t0 = Math.min(t0, t); t1 = Math.max(t1, t);
    });
    if (t0 === Infinity) { box.innerHTML = '<p class="empty">The timeline will appear once votes are cast.</p>'; leg.innerHTML = ''; pk.hidden = true; return; }
    if (t1 === t0) t0 -= HR;
    const pts = []; for (let t = t0; t <= t1; t += HR) pts.push(t);
    const cum = { 1: [], 2: [], 3: [] };
    [1, 2, 3].forEach((k) => { let a = 0; pts.forEach((t) => { a += per[k][t] || 0; cum[k].push(a); }); });
    const max = Math.max(1, ...[1, 2, 3].map((k) => cum[k][cum[k].length - 1]));
    const W = 600, H = 220, L = 34, R = 10, Tp = 10, B = 26, iw = W - L - R, ih = H - Tp - B;
    const X = (i) => L + (pts.length > 1 ? i / (pts.length - 1) : 0) * iw, Y = (v) => Tp + ih - (v / max) * ih;
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = Math.round(max * i / 4), y = Y(max * i / 4);
      g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${v}</text>`;
    }
    [[0, 'start'], [Math.floor((pts.length - 1) / 2), 'middle'], [pts.length - 1, 'end']].forEach(([i, a]) => {
      g += `<text x="${X(i)}" y="${H - 8}" text-anchor="${a}">${fmtH(pts[i])}</text>`;
    });
    const lines = [1, 2, 3].map((k) => `<polyline class="ln" stroke="${RAW[k]}" points="${cum[k].map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ')}"/>`).join('');
    box.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative votes over time">${g}${lines}</svg>`;
    leg.innerHTML = [1, 2, 3].map((k) => `<span style="--cc:${RAW[k]}">${TT[k].n}</span>`).join('');
    const bt = Object.keys(hourTot).reduce((a, b) => hourTot[b] > hourTot[a] ? b : a);
    pk.hidden = false;
    pk.textContent = 'Busiest hour: ' + fmtH(+bt) + ' with ' + hourTot[bt] + ' vote' + (hourTot[bt] > 1 ? 's' : '') + '.';
  }

  async function refresh() {
    try { data = await fetchResults(); $('err').hidden = true; render(data); }
    catch (e) {
      $('err').hidden = false;
      $('err').textContent = 'Couldn’t load results. Retrying…';
      if (!data) { $('title').textContent = 'Results unavailable'; $('dek').textContent = ''; }
    }
  }

  /* ══ THEME + INIT ══ */
  $('themeBtn').addEventListener('click', () => {
    const d = document.body.classList.toggle('theme-dark');
    document.body.classList.toggle('theme-light', !d);
    localStorage.setItem('mb_theme', d ? 'theme-dark' : 'theme-light');
  });
  tick(); setInterval(tick, 1000);
  refresh(); setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
